<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบบันทึกรายรับรายจ่าย</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">

  <!-- Navbar -->
  <div class="flex justify-between items-center p-4 shadow-md bg-gradient-to-b from-gray-300 to-white dark:from-gray-800 dark:to-gray-900 rounded-b-3xl">
    <button class="flex items-center gap-2 px-4 py-2 bg-white dark:bg-gray-700 text-blue-600 dark:text-blue-400 shadow-lg rounded-xl hover:scale-105 transition-transform">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10.707 1.707a1 1 0 00-1.414 0L2 9h2v7a1 1 0 001 1h3a1 1 0 001-1V12h2v4a1 1 0 001 1h3a1 1 0 001-1V9h2l-7.293-7.293z"/>
      </svg>
      หน้าหลัก
    </button>

    <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-white dark:bg-gray-700 shadow-md flex items-center justify-center hover:rotate-90 transition-transform duration-300">
      <span id="theme-icon">
        <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-500 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m8.66-9h1M3.34 12h1M16.24 7.76l.7.7M7.06 16.94l.7.7M16.24 16.24l.7-.7M7.06 7.06l.7-.7M12 8a4 4 0 100 8 4 4 0 000-8z" />
        </svg>
        <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-200 hidden dark:inline" fill="currentColor" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 0010.17 9.79z"/>
        </svg>
      </span>
    </button>
  </div>

  <!-- ฟอร์ม -->
  <div class="max-w-3xl mx-auto p-6">
    <h1 class="text-3xl font-semibold text-center text-gray-800 dark:text-white mb-6">บันทึกรายรับรายจ่าย</h1>

    <input type="hidden" id="edit-index" value="" />

    <div class="mb-4">
      <label class="text-lg text-gray-700 dark:text-white">จำนวนเงิน</label>
      <input id="amount" type="number" class="w-full mt-2 p-3 rounded-lg bg-gray-200 dark:bg-gray-700 text-black dark:text-white" placeholder="จำนวนเงิน">
    </div>

    <div class="mb-4">
      <label class="text-lg text-gray-700 dark:text-white">ประเภท</label>
      <select id="type" class="w-full mt-2 p-3 rounded-lg bg-gray-200 dark:bg-gray-700 text-black dark:text-white">
        <option value="income">รายรับ</option>
        <option value="expense">รายจ่าย</option>
      </select>
    </div>

    <button onclick="submitTransaction()" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">บันทึก</button>
  </div>

  <!-- รายการ -->
  <div class="max-w-3xl mx-auto p-6">
    <h2 class="text-2xl font-semibold text-gray-800 dark:text-white mb-4">รายการ</h2>
    <div id="transaction-list" class="space-y-4"></div>
  </div>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    function getTransactions() {
      return JSON.parse(localStorage.getItem("transactions") || "[]");
    }

    function saveTransactions(data) {
      localStorage.setItem("transactions", JSON.stringify(data));
    }

    function submitTransaction() {
      const amount = document.getElementById("amount").value;
      const type = document.getElementById("type").value;
      const editIndex = document.getElementById("edit-index").value;

      if (!amount || amount <= 0) {
        alert("กรุณากรอกจำนวนเงินที่ถูกต้อง");
        return;
      }

      const transaction = {
        amount: parseFloat(amount),
        type: type,
        date: new Date().toLocaleString(),
      };

      let transactions = getTransactions();

      if (editIndex !== "") {
        transactions[editIndex] = transaction;
        document.getElementById("edit-index").value = "";
      } else {
        transactions.push(transaction);
      }

      saveTransactions(transactions);
      displayTransactions();
      clearForm();
    }

    function clearForm() {
      document.getElementById("amount").value = "";
      document.getElementById("type").value = "income";
      document.getElementById("edit-index").value = "";
    }

    function deleteTransaction(index) {
      const transactions = getTransactions();
      if (confirm("คุณต้องการลบรายการนี้หรือไม่?")) {
        transactions.splice(index, 1);
        saveTransactions(transactions);
        displayTransactions();
      }
    }

    function editTransaction(index) {
      const transactions = getTransactions();
      const transaction = transactions[index];
      document.getElementById("amount").value = transaction.amount;
      document.getElementById("type").value = transaction.type;
      document.getElementById("edit-index").value = index;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function displayTransactions() {
      const transactions = getTransactions();
      const list = document.getElementById("transaction-list");
      list.innerHTML = "";

      transactions.forEach((t, index) => {
        const typeClass = t.type === "income" ? "text-green-600" : "text-red-600";
        const typeText = t.type === "income" ? "รายรับ" : "รายจ่าย";

        const item = document.createElement("div");
        item.className = "flex justify-between items-center p-4 bg-gray-100 dark:bg-gray-800 rounded-lg shadow";

        item.innerHTML = `
          <div>
            <div class="text-lg font-bold ${typeClass}">${typeText}</div>
            <div class="text-gray-500 dark:text-gray-400">${t.date}</div>
          </div>
          <div class="text-right">
            <div class="text-xl font-bold ${typeClass}">${t.amount} บาท</div>
            <div class="flex space-x-2 mt-2 justify-end">
              <button onclick="editTransaction(${index})" class="text-sm bg-yellow-400 hover:bg-yellow-500 px-3 py-1 rounded">แก้ไข</button>
              <button onclick="deleteTransaction(${index})" class="text-sm bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded">ลบ</button>
            </div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    window.onload = displayTransactions;
  </script>
</body>
</html>
