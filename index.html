<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WedAPP2025</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      transition: background 0.3s, color 0.3s;
      background: #fff;
      color: #000;
       background-image: url('background-tech.jpg'); /* ใส่ภาพพื้นหลัง */
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }

    body.dark {
      background: #1a1a1a;
      color: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #f5f5f5;
    }

    body.dark header {
      background: #333;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
    }

    nav a {
      margin-left: 1.5rem;
      text-decoration: none;
      color: inherit;
      font-weight: 500;
    }

    .toggle-mode {
      margin-left: 2rem;
      padding: 0.5rem 1rem;
      border: 1px solid #aaa;
      border-radius: 5px;
      background: none;
      cursor: pointer;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    /* Container for buttons */
    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 50px;
    }

    /* Liquid Button Styles */
    .btn {
      position: relative;
      display: inline-block;
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      color: rgb(0, 255, 0); /* สีเขียว */
      text-decoration: none;
      background: none;
      border: 2px solid #646cff;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s ease;
      min-width: 120px;
      text-align: center;
    }

    .liquid {
      background: linear-gradient(#646cff 0 0) no-repeat calc(200% - var(--p, 0%))
        100% / 200% var(--p, 0.2em);
      transition: 0.3s var(--t, 0s),
        background-position 0.3s calc(0.3s - var(--t, 0s));
    }

    .liquid:hover {
      --p: 100%;
      --t: 0.3s;
      color: rgb(0, 255, 0); /* สีเขียวตอน hover */
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <nav>
      <a href="#">หน้าแรก</a>
      <a href="#">แจ้งเตือน</a>
      <a href="#">Updeat</a>
      <button class="toggle-mode" onclick="toggleMode()">🌙 / ☀️</button>
    </nav>
  </header>

  <main>
    <h1>WedApp2025</h1>

    <!-- แถวของปุ่ม Liquid Fill -->
    <div class="button-row">
      <a href="#" class="btn liquid"><span>Liquid 1</span></a>
      <a href="#" class="btn liquid"><span>Liquid 2</span></a>
      <a href="#" class="btn liquid"><span>Liquid 3</span></a>
      <a href="#" class="btn liquid"><span>Liquid 4</span></a>
      <a href="#" class="btn liquid"><span>Liquid 5</span></a>
      <a href="#" class="btn liquid"><span>Liquid 6</span></a>
    </div>
  </main>

  <script>
    function toggleMode() {
      document.body.classList.toggle('dark');
    }
  </script>
</body>
</html>
